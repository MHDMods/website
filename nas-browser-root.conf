<VirtualHost *:80>
    ServerName rb3pixel.ddns.net
    DocumentRoot /home/server/filetransfer
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =rb3pixel.ddns.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName rb3pixel.ddns.net
    DocumentRoot /home/server/filetransfer

    SSLEngine on
    # Using the certs we just generated/linked
    SSLCertificateFile /home/server/filetransfer/certs/server.crt
    SSLCertificateKeyFile /home/server/filetransfer/certs/server.key

    <Directory /home/server/filetransfer>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nas-browser-error.log
    CustomLog ${APACHE_LOG_DIR}/nas-browser-access.log combined
</VirtualHost>
